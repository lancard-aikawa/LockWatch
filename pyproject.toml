[project]
name = "lockwatch"
version = "0.1.0"
description = "List vulnerabilities in the lock files of all your repositories with osv-scanner, keeping private ones offline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lockwatch = "lockwatch.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
